<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Economic similarity within and across technical architectures">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial" font-size="22" font-weight="700" fill="#17212b">Does architecture tell us what a token does?</text>
<text x="30" y="64" font-family="Arial" font-size="13" fill="#647383">Average overlap across ten verified economic functions; 100% means identical function profiles.</text>
<text x="185" y="138" text-anchor="end" font-family="Arial" font-size="14" fill="#17212b">Same architecture</text>
<rect x="205" y="115" width="620" height="34" rx="4" fill="#e8edf1"/>
<rect x="205" y="115" width="320.7" height="34" rx="4" fill="#3478b8"/>
<text x="535.7" y="138" font-family="Arial" font-size="14" font-weight="700" fill="#17212b">51.7%</text>
<text x="185" y="213" text-anchor="end" font-family="Arial" font-size="14" fill="#17212b">Different architecture</text>
<rect x="205" y="190" width="620" height="34" rx="4" fill="#e8edf1"/>
<rect x="205" y="190" width="205.2" height="34" rx="4" fill="#d99a2b"/>
<text x="420.2" y="213" font-family="Arial" font-size="14" font-weight="700" fill="#17212b">33.1%</text>
<line x1="30" y1="265" x2="870" y2="265" stroke="#d7dde3"/>
<text x="30" y="302" font-family="Arial" font-size="18" font-weight="700" fill="#17212b">Architecture helps somewhat</text>
<text x="30" y="330" font-family="Arial" font-size="14" fill="#17212b">Difference: +18.6 percentage points · permutation p = 0.000</text>
<text x="30" y="365" font-family="Arial" font-size="14" font-weight="700" fill="#17212b">Action: classify economic functions directly; do not infer them from “L1”, “PoS”, “PoW”, or “DeFi”.</text>
<text x="30" y="393" font-family="Arial" font-size="12" fill="#647383">Descriptive classification test—not evidence about returns or fair value.</text>
</svg>
