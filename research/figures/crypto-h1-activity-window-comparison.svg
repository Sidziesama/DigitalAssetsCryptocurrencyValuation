<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350" role="img" aria-label="H1 coefficient comparison across 90-day and one-year windows">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="30" font-family="Arial" font-size="20" font-weight="600" fill="#17212b">H1 changes across observation windows</text>
<text x="24" y="52" font-family="Arial" font-size="12" fill="#647383">Same nine networks and model; the one-year extension is retrospective robustness, not independent validation.</text>
<line x1="500" y1="72" x2="500" y2="310" stroke="#647383" stroke-width="1.5"/>
<text x="24" y="107" font-family="Arial" font-size="13" fill="#17212b">90-day frozen expansion: Active addresses</text>
<rect x="500.0" y="92" width="38.9" height="22" fill="#3478b8"/>
<text x="546.9" y="107" text-anchor="start" font-family="Arial" font-size="12" fill="#17212b">+0.0378 · p=0.344</text>
<text x="24" y="165" font-family="Arial" font-size="13" fill="#17212b">90-day frozen expansion: Transactions</text>
<rect x="456.8" y="150" width="43.2" height="22" fill="#3478b8"/>
<text x="448.8" y="165" text-anchor="end" font-family="Arial" font-size="12" fill="#17212b">-0.0420 · p=0.137</text>
<text x="24" y="223" font-family="Arial" font-size="13" fill="#17212b">One-year retrospective robustness: Active addresses</text>
<rect x="500.0" y="208" width="179.8" height="22" fill="#8aa8c2"/>
<text x="687.8" y="223" text-anchor="start" font-family="Arial" font-size="12" fill="#17212b">+0.1748 · p=0.184</text>
<text x="24" y="281" font-family="Arial" font-size="13" fill="#17212b">One-year retrospective robustness: Transactions</text>
<rect x="500.0" y="266" width="330.0" height="22" fill="#8aa8c2"/>
<text x="838.0" y="281" text-anchor="start" font-family="Arial" font-size="12" fill="#17212b">+0.3208 · p=0.078</text>
<text x="500" y="337" text-anchor="middle" font-family="Arial" font-size="12" fill="#647383">Coefficient on lagged log(1 + activity); zero is the vertical line</text>
</svg>
